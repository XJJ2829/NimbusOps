[project]
name = "my-agent"
version = "0.1.0"
description = "A browser/server Agent project built from nanobot core, tools, providers, and config systems."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "My-agent contributors" }
]
keywords = ["ai", "agent", "mcp", "websocket", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "typer>=0.20.0,<1.0.0",
  "anthropic>=0.45.0,<1.0.0",
  "pydantic>=2.12.0,<3.0.0",
  "pydantic-settings>=2.12.0,<3.0.0",
  "websockets>=16.0,<17.0",
  "websocket-client>=1.9.0,<2.0.0",
  "httpx>=0.28.0,<1.0.0",
  "ddgs>=9.5.5,<10.0.0",
  "oauth-cli-kit>=0.1.3,<1.0.0",
  "loguru>=0.7.3,<1.0.0",
  "readability-lxml>=0.8.4,<1.0.0",
  "lxml-html-clean>=0.4.0,<1.0.0",
  "rich>=14.0.0,<15.0.0",
  "croniter>=6.0.0,<7.0.0",
  "prompt-toolkit>=3.0.50,<4.0.0",
  "questionary>=2.0.0,<3.0.0",
  "mcp>=1.26.0,<2.0.0",
  "json-repair>=0.57.0,<1.0.0",
  "chardet>=3.0.2,<6.0.0",
  "openai>=2.8.0",
  "tiktoken>=0.12.0,<1.0.0",
  "jinja2>=3.1.0,<4.0.0",
  "dulwich>=0.22.0,<1.0.0",
  "pyyaml>=6.0,<7.0.0",
  "pypdf>=5.0.0,<6.0.0",
  "python-docx>=1.1.0,<2.0.0",
  "openpyxl>=3.1.0,<4.0.0",
  "python-pptx>=1.0.0,<2.0.0",
  "filelock>=3.25.2",
  "boto3>=1.43.0",
  "psutil>=6.1.0,<8.0.0",
  "antlr4-python3-runtime==4.13.2",
  "langchain>=1.3.0,<2.0.0",
  "langchain-core>=1.4.0,<2.0.0",
]

[project.optional-dependencies]
azure = [
  "azure-identity>=1.19.0,<2.0.0",
]
pdf = [
  "pymupdf>=1.25.0",
]
prompt-guardrails = [
  "torch>=2.8.0",
  "transformers>=4.57.0",
  "safetensors>=0.5.0",
  "tokenizers>=0.21.0",
]
dev = [
  "pytest>=9.0.0,<10.0.0",
  "pytest-asyncio>=1.3.0,<2.0.0",
  "pytest-cov>=6.0.0,<7.0.0",
  "ruff>=0.1.0",
  "httpx>=0.28.0,<1.0.0",
]

[project.scripts]
my-agent = "my_agent.__main__:main"
nimbusops-privileged-helper = "my_agent.security.privileged_helper:main"
nimbusops-helper = "my_agent.security.privileged_setup:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
  "my_agent/**/*.py",
  "my_agent/**/*.json",
  "my_agent/templates/**/*.md",
  "my_agent/skills/**/*.md",
  "my_agent/skills/**/*.sh",
  "my_agent/agentspec/**/*.rule",
  "my_agent/agentspec/**/*.g4",
  "my_agent/guardrails/NOTICE",
  "my_agent/guardrails/THIRD_PARTY_LICENSE_FORGE",
  "docs/**/*.md",
  "deploy/**/*",
  "webui/dist/**/*",
]
artifacts = [
  "webui/dist/**/*",
]

[tool.hatch.build.targets.wheel]
packages = ["my_agent"]

[tool.hatch.build.targets.sdist]
include = [
  "my_agent/",
  "webui/",
  "docs/",
  "deploy/",
  "tests/",
  "README.md",
  "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["my_agent"]
omit = ["tests/*", "**/tests/*"]
