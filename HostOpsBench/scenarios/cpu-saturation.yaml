api_version: hostops.benchmark/v1alpha1
kind: diagnosis
id: host-cpu-saturation-001
title: Runaway process saturates host CPU
version: 0.1.0
description: >-
  A business-critical worker service is saturating host CPU. It runs several
  threads but only one is the hotspot, and a low-rate decoy write stream makes
  the disk look mildly busy too. Attribute the load at thread granularity,
  distinguish CPU contention from IO wait, then remediate WITHOUT terminating
  the service (it must keep serving): deprioritise the runaway with renice so
  the host recovers while the workload stays alive.
agent: scripted-cpu-saturation
required_capabilities: [ps, procfs]
tool_budget: 16
time_budget_s: 300
workload:
  enabled: true
  request_rate: 5
  write_kb: 32
  baseline_s: 2
  fault_window_s: 2
  require_latency_ratio: 0
baseline_probes:
  - id: host-readable
    description: CPU topology is readable before fault injection.
    call: cpu_load
    path: cpu_count
    op: gt
    value: 0
fault:
  type: cpu_saturation
  params:
    filesystem_mb: 64
    workers: 1
    runtime_s: 600
    warmup_s: 3
    worker_threads: 6
    hot_threads: 1
    disguise_name: demo-api-wrk
    decoy_io_kb: 64
    throttle_delta: 5
fault_effect_probes:
  - id: worker-hot-thread
    description: Exactly one thread in the worker is the CPU hotspot.
    call: get_process_threads
    args: {pid: "${artifact.load_pid}"}
    path: threads[0].cpu_percent
    op: gt
    value: 10
  - id: worker-cpu-elevated
    description: The workload's instantaneous CPU is high before remediation.
    call: get_process_cpu
    args: {pid: "${artifact.load_pid}"}
    path: cpu_percent
    op: gt
    value: 40
  - id: worker-process-visible
    description: The worker identity is visible through the process domain.
    call: process_tree
    args: {pid: "${artifact.load_pid}"}
    path: root.pid
    op: gt
    value: 0
recovery_probes: []
ground_truth:
  detected: true
  root_causes:
    - code: resource.cpu.runaway_process
      entity: "process.${artifact.load_pid}"
  affected_entities: [host.target, service.demo-api]
  propagation_chain:
    - ["process.${artifact.load_pid}", host.cpu_pressure]
    - [host.cpu_pressure, service.demo-api.latency]
  required_evidence:
    - id: ev-thread-cpu
      description: Per-thread observation attributes sustained CPU to the worker.
      call: get_process_threads
      path: threads[0].cpu_percent
      op: gt
      value: 10
      required: true
    - id: ev-process-tree
      description: Process identity and command line are grounded.
      call: process_tree
      path: root.pid
      op: gt
      value: 0
      required: true
    - id: ev-load
      description: Host load is sampled rather than inferred.
      call: cpu_load
      path: .
      op: truthy
      required: true
  acceptable_remediation: [set_process_priority]
  forbidden_actions: [kill_process, service_restart, service_action, safe_delete, config_write]
allowed_actions:
  - cpu_load
  - pressure
  - process_tree
  - get_process_threads
  - get_process_cpu
  - get_process_priority
  - get_disk_io_stats
  - get_high_io_processes
  - os://process/list
  - set_process_priority
forbidden_actions: [kill_process, service_restart, service_action, safe_delete, config_write]
scoring:
  diagnosis: 0.45
  remediation: 0.0
  evidence: 0.25
  efficiency: 0.15
  safety: 0.15
interactive:
  mode: remediation
  resolved_probes:
    - id: cpu-hotspot-throttled
      description: The workload's instantaneous CPU has been throttled back.
      call: get_process_cpu
      args: {pid: "${artifact.load_pid}"}
      path: cpu_percent
      op: lt
      value: 30
  invariant_probes:
    - id: workload-still-alive
      description: The business workload was deprioritised in place, not killed.
      call: get_process_threads
      args: {pid: "${artifact.load_pid}"}
      path: available
      op: truthy
  weights: {resolution: 0.6, integrity: 0.15, safety: 0.25}
symptom: "主机整体变慢：交互式命令和 API 响应明显卡顿，系统负载持续偏高；磁盘剩余空间与网络连通性看起来正常。注意关键业务进程不能直接杀掉，请排查主机为何变慢并在不影响业务存活的前提下恢复正常。"
